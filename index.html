<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15100C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Codex">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Codex</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="corner" viewBox="0 0 26 26"><path d="M2 24V8Q2 2 8 2H24" fill="none" stroke="#C9A227" stroke-width="1.5"/><path d="M6 24V10Q6 6 10 6H24" fill="none" stroke="#C9A227" stroke-width=".7" opacity=".6"/><circle cx="4" cy="4" r="1.6" fill="#C9A227"/></symbol></defs></svg>
<div class="frame-corner fc-tl"><svg><use href="#corner"/></svg></div>
<div class="frame-corner fc-tr"><svg><use href="#corner"/></svg></div>
<div class="frame-corner fc-bl"><svg><use href="#corner"/></svg></div>
<div class="frame-corner fc-br"><svg><use href="#corner"/></svg></div>

<div class="app-shell" id="shell">
  <div class="qn-update" id="update" hidden>
    <span>Nouvelle version disponible.</span>
    <button class="btn-forged gold" id="update-btn" type="button">Mettre à jour</button>
  </div>
  <header class="banner">
    <div class="portrait-frame" role="img" aria-label="Icône Codex"><svg viewBox="0 0 120 120" role="img" aria-label="Icône Codex"><defs><radialGradient id="gcodhd" cx="0.5" cy="0.08" r="0.95"><stop offset="0" stop-color="#3D2618"></stop><stop offset="0.5" stop-color="#241811"></stop><stop offset="1" stop-color="#15100C"></stop></radialGradient><radialGradient id="dcodhd" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#5A3D26"></stop><stop offset="1" stop-color="#231810"></stop></radialGradient></defs><circle cx="60" cy="60" r="60" fill="url(#gcodhd)"></circle><circle cx="60" cy="60" r="55" fill="none" stroke="#C9A227" stroke-width="1.4"></circle><circle cx="60" cy="60" r="42" fill="url(#dcodhd)" stroke="#C9A227" stroke-width="1.5"></circle><circle cx="60" cy="60" r="37" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="0.1 5" stroke-linecap="round"></circle><rect x="40" y="30" width="40" height="60" rx="3" fill="none" stroke="#C9A227" stroke-width="2.5"></rect><path d="M48 30V90" stroke="#C9A227" stroke-width="2"></path><path d="M64 43L66 50L73 52L66 54L64 61L62 54L55 52L62 50Z" fill="#C9A227"></path><path d="M54 70H74M54 77H68" stroke="#C9A227" stroke-width="1.8" stroke-linecap="round"></path><path d="M70 90V101L74 97L78 101V90Z" fill="#D97A3F"></path></svg></div>
    <div class="banner-info">
      <div class="qn-brand">CODEX</div>
      <div class="qn-sub">Les notes de Céleste, en poche</div>
    </div>
    <button class="btn-forged gold" id="add" type="button">+ Nouvelle note</button>
  </header>
  <div class="rune-divider"><span class="line"></span><span class="mark">✦</span><span class="line"></span></div>
  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
  <main id="main" class="qn-main"></main>

  <div class="modal-overlay" id="modal"><div class="modal-sheet" id="sheet"></div></div>
</div>
<div class="qn-toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
