<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15100C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Codex">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Codex</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="corner" viewBox="0 0 26 26"><path d="M2 24V8Q2 2 8 2H24" fill="none" stroke="#C9A227" stroke-width="1.5"/><path d="M6 24V10Q6 6 10 6H24" fill="none" stroke="#C9A227" stroke-width=".7" opacity=".6"/><circle cx="4" cy="4" r="1.6" fill="#C9A227"/></symbol></defs></svg>
<div class="frame-corner fc-tl"><svg><use href="#corner"/></svg></div>
<div class="frame-corner fc-tr"><svg><use href="#corner"/></svg></div>
<div class="frame-corner fc-bl"><svg><use href="#corner"/></svg></div>
<div class="frame-corner fc-br"><svg><use href="#corner"/></svg></div>

<div class="app-shell" id="shell">
  <div class="qn-update" id="update" hidden>
    <span>Nouvelle version disponible.</span>
    <button class="btn-forged gold" id="update-btn" type="button">Mettre à jour</button>
  </div>
  <header class="banner">
    <div class="portrait-frame" aria-hidden="true"><div class="ring"></div><div class="fill">C</div></div>
    <div class="banner-info">
      <div class="qn-brand">CODEX</div>
      <div class="qn-sub">Les notes de Céleste, en poche</div>
    </div>
    <button class="btn-forged gold" id="add" type="button">+ Nouvelle note</button>
  </header>
  <div class="rune-divider"><span class="line"></span><span class="mark">✦</span><span class="line"></span></div>
  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
  <main id="main" class="qn-main"></main>

  <div class="modal-overlay" id="modal"><div class="modal-sheet" id="sheet"></div></div>
</div>
<div class="qn-toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
